name: Publish SDK to GitHub Packages

# 仅在打 tag（sdk-v* 或 v*）时发布 kmessage-sdk 到 GitHub Packages。
# GitHub Packages 不支持 SNAPSHOT 覆盖，每次发布的版本号必须唯一，
# 因此 CI 从 git tag 提取版本号并写入 pom.xml 后再 deploy。
#
# 打 tag 示例：
#   git tag sdk-v0.1.0 && git push origin sdk-v0.1.0
#   git tag v0.2.0     && git push origin v0.2.0
on:
  push:
    tags:
      - 'sdk-v*'
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write   # 写入当前仓库的 GitHub Packages

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # 用 GITHUB_TOKEN 发布到当前仓库的 Packages（distributionManagement 已指向本仓库）
          server-id: github
          server-username: GITHUB_USER
          server-password: GITHUB_TOKEN
          overwrite-settings: true

      - name: Extract version from tag
        id: ver
        run: |
          set -euo pipefail
          # 支持两种 tag 格式：sdk-v0.1.0 / v0.1.0
          RAW="${GITHUB_REF_NAME#sdk-v}"   # 去掉 sdk-v 前缀（若无则不变）
          RAW="${RAW#v}"                   # 去掉 v 前缀
          # 仅保留语义版本号本身（剥掉任何构建元信息）
          VERSION="${RAW}"
          echo "Extracted Maven version: ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          # 非 SNAPSHOT 且格式非法则直接退出，避免发布垃圾版本
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?(\+[A-Za-z0-9.-]+)?$'; then
            echo "::error::Invalid version from tag: ${VERSION} (expected like 0.1.0)"
            exit 1
          fi

      - name: Run SDK tests
        working-directory: kmessage-sdk
        run: mvn -B test

      - name: Set version & publish
        working-directory: kmessage-sdk
        env:
          GITHUB_USER: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          echo "Setting version to ${VERSION}"
          mvn -B versions:set -DnewVersion="${VERSION}" -DgenerateBackupPoms=false
          mvn -B clean deploy
          echo "::notice::Published com.kK-2004:kmessage-sdk:${VERSION} to GitHub Packages"
